<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Adivinanzas Infantiles{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive, sans-serif;
            background: linear-gradient(135deg, #e7d258, #CAEBFF);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #471111;
        }
        nav ul {
            list-style: disc;
            padding-left: 20px;
            margin-bottom: 20px;
        }
        nav ul li {
            margin-bottom: 6px;
        }
        nav a {
            color: #0845ca;
            text-decoration: underline;
            font-weight: bold;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
        }
        main {
            max-width: 750px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 25px;
            padding: 30px;
            border: 4px dashed #a31c6b; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-family: 'Fredoka', sans-serif;
            color: #f79605;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="{% url 'adivinanza1' %}">Adivinanzas Animales</a></li>
            <li><a href="{% url 'adivinanza2' %}">Adivinanzas Frutas</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; Adivinanzas Infantiles</p>
    </footer>

</body>
</html>
